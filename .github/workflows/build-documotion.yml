name: Build original DocuMotion Pro into VibePulse

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-documotion.yml"
      - "client/src/pages/DocuMotionStudio.jsx"

permissions:
  contents: write

jobs:
  build-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VibePulse
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout original DocuMotion Pro source branch
        uses: actions/checkout@v4
        with:
          ref: vibepuls-patch-1
          path: documotion-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install original DocuMotion Pro dependencies
        working-directory: documotion-source
        run: npm install --legacy-peer-deps

      - name: Prepare sample image assets for hosted subpath
        run: |
          mkdir -p documotion-source/public/assets/images
          cp -R documotion-source/src/assets/images/. documotion-source/public/assets/images/
          sed -i 's#/src/assets/images/#/autocut-studio-app/assets/images/#g' documotion-source/src/data/sampleDocumentaryProjects.ts

      - name: Remove obsolete Tailwind PostCSS config
        run: rm -f documotion-source/postcss.config.js

      - name: Build original DocuMotion Pro
        working-directory: documotion-source
        run: npm run build -- --base=/autocut-studio-app/

      - name: Verify build output and sample images
        run: |
          test -f documotion-source/dist/index.html
          test -f documotion-source/dist/assets/images/doc_historical_archive_1793378428245.jpg
          grep -q '/autocut-studio-app/assets/images/doc_historical_archive_1793378428245.jpg' documotion-source/dist/assets/*.js

      - name: Place built studio inside VibePulse public assets
        run: |
          rm -rf client/public/autocut-studio-app
          mkdir -p client/public/autocut-studio-app
          cp -R documotion-source/dist/. client/public/autocut-studio-app/

      - name: Commit generated studio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/autocut-studio-app
          if git diff --cached --quiet; then
            echo "No generated studio asset changes."
          else
            git commit -m "Fix DocuMotion Pro sample image paths"
            git push origin HEAD:main
          fi
